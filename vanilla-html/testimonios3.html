<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Testimonios — v3: Polaroids</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root { --accent: #EC6768; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; font-family: 'Inter', sans-serif; background: #f0ede8; overflow-x: hidden; }

    .label-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 999;
      background: var(--accent); color: #000; text-align: center;
      padding: 7px 0; font-size: 0.65rem; font-weight: 700;
      letter-spacing: 0.2em; text-transform: uppercase;
    }

    .testimonios {
      background: #f0ede8;
      padding: 100px 60px 110px;
    }

    .testimonios__header {
      text-align: center;
      margin-bottom: 60px;
    }

    .testimonios__tag {
      display: block;
      font-size: 0.65rem; font-weight: 500;
      letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--accent); margin-bottom: 16px;
    }

    .testimonios__title {
      font-family: 'Barlow Condensed', sans-serif; font-weight: 800;
      font-size: clamp(2.4rem, 5vw, 4rem);
      text-transform: uppercase; color: #111; line-height: 1;
    }

    /* ─── GRID ──────────────────────────────────────────────────── */
    .testimonios__grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 20px;
      max-width: 1100px;
      margin: 0 auto;
      align-items: start;
    }

    /* ─── POLAROID CARD ─────────────────────────────────────────── */
    .polaroid {
      background: #fff;
      padding: 10px 10px 36px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.14), 0 1px 4px rgba(0,0,0,0.08);
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .polaroid:nth-child(1)  { transform: rotate(-3deg); }
    .polaroid:nth-child(2)  { transform: rotate(2deg);  margin-top: 24px; }
    .polaroid:nth-child(3)  { transform: rotate(-5deg); }
    .polaroid:nth-child(4)  { transform: rotate(4deg);  margin-top: 16px; }
    .polaroid:nth-child(5)  { transform: rotate(-2deg); margin-top: 8px;  }
    .polaroid:nth-child(6)  { transform: rotate(5deg);  margin-top: 20px; }
    .polaroid:nth-child(7)  { transform: rotate(-4deg); }
    .polaroid:nth-child(8)  { transform: rotate(3deg);  margin-top: 28px; }
    .polaroid:nth-child(9)  { transform: rotate(-1deg); margin-top: 12px; }
    .polaroid:nth-child(10) { transform: rotate(6deg);  margin-top: 4px;  }

    .polaroid:hover {
      transform: rotate(0deg) scale(1.05) !important;
      box-shadow: 0 16px 40px rgba(0,0,0,0.22);
      z-index: 10; position: relative;
    }

    .polaroid img {
      width: 100%; aspect-ratio: 9/16;
      object-fit: cover; display: block;
    }

    @media (max-width: 1024px) {
      .testimonios__grid { grid-template-columns: repeat(4, 1fr); }
      .polaroid:nth-child(9), .polaroid:nth-child(10) { display: none; }
    }

    @media (max-width: 768px) {
      .testimonios { padding: 64px 24px 80px; }
      .testimonios__grid { grid-template-columns: repeat(3, 1fr); gap: 14px; }
      .polaroid:nth-child(9), .polaroid:nth-child(10) { display: block; }
      /* menor rotación en móvil */
      .polaroid:nth-child(1)  { transform: rotate(-2deg); margin-top: 0; }
      .polaroid:nth-child(2)  { transform: rotate(1.5deg); margin-top: 14px; }
      .polaroid:nth-child(3)  { transform: rotate(-3deg); margin-top: 0; }
      .polaroid:nth-child(4)  { transform: rotate(2deg);  margin-top: 10px; }
      .polaroid:nth-child(5)  { transform: rotate(-1.5deg); margin-top: 0; }
      .polaroid:nth-child(6)  { transform: rotate(3deg);  margin-top: 12px; }
      .polaroid:nth-child(7)  { transform: rotate(-2deg); margin-top: 0; }
      .polaroid:nth-child(8)  { transform: rotate(1deg);  margin-top: 16px; }
      .polaroid:nth-child(9)  { transform: rotate(-2.5deg); margin-top: 0; }
      .polaroid:nth-child(10) { transform: rotate(2deg);  margin-top: 8px; }
    }

    @media (max-width: 480px) {
      .testimonios__grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .polaroid:nth-child(9), .polaroid:nth-child(10) { display: none; }
      .polaroid { padding: 7px 7px 28px; }
    }
  </style>
</head>
<body>
  <div class="label-bar">v3 — polaroids (fondo crema)</div>

  <section class="testimonios" style="margin-top: 32px;">
    <div class="testimonios__header">
      <span class="testimonios__tag">@cl4u8io · Instagram</span>
      <h2 class="testimonios__title">Lo que piensan</h2>
    </div>

    <div class="testimonios__grid">
      <div class="polaroid"><img src="assets/resenas-01.JPG" alt="" loading="lazy"></div>
      <div class="polaroid"><img src="assets/resenas-02.jpg" alt="" loading="lazy"></div>
      <div class="polaroid"><img src="assets/resenas-03.jpg" alt="" loading="lazy"></div>
      <div class="polaroid"><img src="assets/resenas-04.jpg" alt="" loading="lazy"></div>
      <div class="polaroid"><img src="assets/resenas-05.jpg" alt="" loading="lazy"></div>
      <div class="polaroid"><img src="assets/resenas-06.jpg" alt="" loading="lazy"></div>
      <div class="polaroid"><img src="assets/resenas-07.jpg" alt="" loading="lazy"></div>
      <div class="polaroid"><img src="assets/resenas-08.jpg" alt="" loading="lazy"></div>
      <div class="polaroid"><img src="assets/resenas-09.jpg" alt="" loading="lazy"></div>
      <div class="polaroid"><img src="assets/resenas-10.jpg" alt="" loading="lazy"></div>
    </div>
  </section>
</body>
</html>
