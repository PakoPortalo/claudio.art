<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Testimonios — v2: Grid uniforme oscuro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root { --accent: #EC6768; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; font-family: 'Inter', sans-serif; background: rgb(14,14,14); overflow-x: hidden; }

    .label-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 999;
      background: var(--accent); color: #000; text-align: center;
      padding: 7px 0; font-size: 0.65rem; font-weight: 700;
      letter-spacing: 0.2em; text-transform: uppercase;
    }

    .testimonios {
      background: rgb(14,14,14);
      padding: 100px 60px 110px;
    }

    .testimonios__header {
      text-align: center;
      margin-bottom: 56px;
    }

    .testimonios__tag {
      display: block;
      font-size: 0.65rem; font-weight: 500;
      letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--accent); margin-bottom: 16px;
    }

    .testimonios__title {
      font-family: 'Barlow Condensed', sans-serif; font-weight: 800;
      font-size: clamp(2.4rem, 5vw, 4rem);
      text-transform: uppercase; color: #fff; line-height: 1;
    }

    .testimonios__grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .testimonios__item {
      position: relative;
      aspect-ratio: 9/16;
      border-radius: 10px;
      overflow: hidden;
      background: #1a1a1a;
      cursor: pointer;
      transition: transform 0.28s ease, box-shadow 0.28s ease;
    }

    .testimonios__item::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      z-index: 2;
    }

    .testimonios__item img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      transition: transform 0.35s ease;
    }

    .testimonios__item:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 48px rgba(0,0,0,0.6);
    }

    .testimonios__item:hover img { transform: scale(1.04); }

    @media (max-width: 1024px) {
      .testimonios { padding: 80px 40px 90px; }
      .testimonios__grid { grid-template-columns: repeat(4, 1fr); }
      /* ocultar el último item para que queden 8 en 2 filas de 4 */
      .testimonios__item:nth-child(9),
      .testimonios__item:nth-child(10) { display: none; }
    }

    @media (max-width: 768px) {
      .testimonios { padding: 64px 16px 80px; }
      .testimonios__grid { grid-template-columns: repeat(3, 1fr); gap: 6px; }
      .testimonios__item:nth-child(9),
      .testimonios__item:nth-child(10) { display: block; }
    }

    @media (max-width: 480px) {
      .testimonios__grid { grid-template-columns: repeat(2, 1fr); gap: 5px; }
      .testimonios__item:nth-child(9),
      .testimonios__item:nth-child(10) { display: none; }
    }
  </style>
</head>
<body>
  <div class="label-bar">v2 — grid uniforme 5 cols (oscuro)</div>

  <section class="testimonios" style="margin-top: 32px;">
    <div class="testimonios__header">
      <span class="testimonios__tag">@cl4u8io · Instagram</span>
      <h2 class="testimonios__title">Lo que piensan</h2>
    </div>

    <div class="testimonios__grid">
      <div class="testimonios__item"><img src="assets/resenas-01.JPG" alt="" loading="lazy"></div>
      <div class="testimonios__item"><img src="assets/resenas-02.jpg" alt="" loading="lazy"></div>
      <div class="testimonios__item"><img src="assets/resenas-03.jpg" alt="" loading="lazy"></div>
      <div class="testimonios__item"><img src="assets/resenas-04.jpg" alt="" loading="lazy"></div>
      <div class="testimonios__item"><img src="assets/resenas-05.jpg" alt="" loading="lazy"></div>
      <div class="testimonios__item"><img src="assets/resenas-06.jpg" alt="" loading="lazy"></div>
      <div class="testimonios__item"><img src="assets/resenas-07.jpg" alt="" loading="lazy"></div>
      <div class="testimonios__item"><img src="assets/resenas-08.jpg" alt="" loading="lazy"></div>
      <div class="testimonios__item"><img src="assets/resenas-09.jpg" alt="" loading="lazy"></div>
      <div class="testimonios__item"><img src="assets/resenas-10.jpg" alt="" loading="lazy"></div>
    </div>
  </section>
</body>
</html>
