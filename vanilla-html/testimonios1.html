<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Testimonios — v1: Marquee scroll</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root { --accent: #EC6768; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; font-family: 'Inter', sans-serif; background: rgb(10,10,10); overflow-x: hidden; }

    .label-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 999;
      background: var(--accent); color: #000; text-align: center;
      padding: 7px 0; font-size: 0.65rem; font-weight: 700;
      letter-spacing: 0.2em; text-transform: uppercase;
    }

    .testimonios {
      background: rgb(10,10,10);
      padding: 100px 0 110px;
      overflow: hidden;
    }

    .testimonios__header {
      text-align: center;
      padding: 0 40px;
      margin-bottom: 56px;
    }

    .testimonios__tag {
      display: block;
      font-size: 0.65rem; font-weight: 500;
      letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--accent); margin-bottom: 16px;
    }

    .testimonios__title {
      font-family: 'Barlow Condensed', sans-serif; font-weight: 800;
      font-size: clamp(2.4rem, 5vw, 4rem);
      text-transform: uppercase; color: #fff; line-height: 1;
    }

    .marquee-row { overflow: hidden; margin-bottom: 10px; }

    .marquee-track {
      display: flex; gap: 10px;
      width: max-content;
      animation: marquee-left 38s linear infinite;
    }

    .marquee-row--reverse .marquee-track {
      animation: marquee-right 44s linear infinite;
    }

    @keyframes marquee-left {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    @keyframes marquee-right {
      0%   { transform: translateX(-50%); }
      100% { transform: translateX(0); }
    }

    .marquee-track:hover { animation-play-state: paused; }

    .mitem {
      flex-shrink: 0;
      width: 160px; height: 284px;
      border-radius: 10px;
      overflow: hidden;
      background: #1a1a1a;
    }
    .mitem img { width: 100%; height: 100%; object-fit: cover; display: block; }

    @media (max-width: 768px) {
      .testimonios { padding: 72px 0 80px; }
      .testimonios__header { padding: 0 24px; margin-bottom: 40px; }
      .mitem { width: 120px; height: 213px; }
    }
  </style>
</head>
<body>
  <div class="label-bar">v1 — marquee / scroll infinito (oscuro)</div>

  <section class="testimonios" style="margin-top: 32px;">
    <div class="testimonios__header">
      <span class="testimonios__tag">@cl4u8io · Instagram</span>
      <h2 class="testimonios__title">Lo que piensan</h2>
    </div>

    <!-- fila 1: izquierda → derecha -->
    <div class="marquee-row">
      <div class="marquee-track">
        <div class="mitem"><img src="assets/resenas-01.JPG" alt="" loading="lazy"></div>
        <div class="mitem"><img src="assets/resenas-02.jpg" alt="" loading="lazy"></div>
        <div class="mitem"><img src="assets/resenas-03.jpg" alt="" loading="lazy"></div>
        <div class="mitem"><img src="assets/resenas-04.jpg" alt="" loading="lazy"></div>

        <div class="mitem"><img src="assets/resenas-06.jpg" alt="" loading="lazy"></div>
        <div class="mitem"><img src="assets/resenas-07.jpg" alt="" loading="lazy"></div>
        <div class="mitem"><img src="assets/resenas-08.jpg" alt="" loading="lazy"></div>
        <div class="mitem"><img src="assets/resenas-09.jpg" alt="" loading="lazy"></div>
        <div class="mitem"><img src="assets/resenas-10.jpg" alt="" loading="lazy"></div>
        <!-- duplicado para loop sin corte -->
        <div class="mitem"><img src="assets/resenas-01.JPG" alt="" loading="lazy"></div>
        <div class="mitem"><img src="assets/resenas-02.jpg" alt="" loading="lazy"></div>
        <div class="mitem"><img src="assets/resenas-03.jpg" alt="" loading="lazy"></div>
        <div class="mitem"><img src="assets/resenas-04.jpg" alt="" loading="lazy"></div>
        <div class="mitem"><img src="assets/resenas-05.jpg" alt="" loading="lazy"></div>
        <div class="mitem"><img src="assets/resenas-06.jpg" alt="" loading="lazy"></div>
        <div class="mitem"><img src="assets/resenas-07.jpg" alt="" loading="lazy"></div>
        <div class="mitem"><img src="assets/resenas-08.jpg" alt="" loading="lazy"></div>
        <div class="mitem"><img src="assets/resenas-09.jpg" alt="" loading="lazy"></div>
        <div class="mitem"><img src="assets/resenas-10.jpg" alt="" loading="lazy"></div>
      </div>
    </div>

    <!-- fila 2: derecha → izquierda -->
    <div class="marquee-row marquee-row--reverse">
      <div class="marquee-track">
        <div class="mitem"><img src="assets/resenas-10.jpg" alt="" loading="lazy"></div>

        <div class="mitem"><img src="assets/resenas-06.jpg" alt="" loading="lazy"></div>
        <div class="mitem"><img src="assets/resenas-05.jpg" alt="" loading="lazy"></div>
        <div class="mitem"><img src="assets/resenas-04.jpg" alt="" loading="lazy"></div>
        <div class="mitem"><img src="assets/resenas-03.jpg" alt="" loading="lazy"></div>
        <div class="mitem"><img src="assets/resenas-02.jpg" alt="" loading="lazy"></div>
        <div class="mitem"><img src="assets/resenas-01.JPG" alt="" loading="lazy"></div>
        <!-- duplicado -->
        <div class="mitem"><img src="assets/resenas-10.jpg" alt="" loading="lazy"></div>
        <div class="mitem"><img src="assets/resenas-09.jpg" alt="" loading="lazy"></div>

        <div class="mitem"><img src="assets/resenas-02.jpg" alt="" loading="lazy"></div>
        <div class="mitem"><img src="assets/resenas-01.JPG" alt="" loading="lazy"></div>
      </div>
    </div>
  </section>
</body>
</html>
