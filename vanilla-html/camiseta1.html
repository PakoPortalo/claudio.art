<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claudio — Camiseta (v1 · avísame)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root { --accent: #EC6768; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; font-family: 'Inter', sans-serif; background: #000; overflow-x: hidden; }

    .camisa {
      position: relative; width: 100%; min-height: 90vh;
      display: flex; align-items: flex-end; overflow: hidden;
    }
    .camisa__bg {
      position: absolute; inset: 0; background: rgb(16,16,16);
      display: flex; align-items: center; justify-content: center;
    }
    .camisa__bg img {
      width: auto; height: 72%; object-fit: contain; display: block;
      filter: grayscale(30%); opacity: 0.6;
    }
    .camisa::after {
      content: ''; position: absolute; inset: 0; z-index: 1;
      background: linear-gradient(to top, rgba(0,0,0,0.88) 0%, rgba(0,0,0,0.2) 55%, transparent 100%);
    }
    .camisa__copy {
      position: relative; z-index: 2;
      padding: 60px 72px; width: 100%;
      display: flex; align-items: flex-end; justify-content: space-between;
      gap: 40px;
    }
    .camisa__left { display: flex; flex-direction: column; gap: 14px; }
    .camisa__tag {
      font-family: 'Inter', sans-serif; font-size: 0.65rem; font-weight: 500;
      letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent);
    }
    .camisa__title {
      font-family: 'Barlow Condensed', sans-serif; font-weight: 800;
      font-size: clamp(3rem, 7vw, 6rem); line-height: 1; text-transform: uppercase; color: #fff;
    }
    .camisa__sub {
      font-family: 'Inter', sans-serif; font-size: 0.8rem; font-weight: 300;
      letter-spacing: 0.12em; color: rgba(255,255,255,0.4); max-width: 360px; line-height: 1.6;
    }
    .camisa__right { display: flex; flex-direction: column; align-items: flex-end; gap: 0; flex-shrink: 0; }
    .camisa__avisa-label {
      font-family: 'Inter', sans-serif; font-size: 0.6rem; font-weight: 400;
      letter-spacing: 0.2em; text-transform: uppercase; color: rgba(255,255,255,0.3);
      margin-bottom: 12px;
    }
    .camisa__form { display: flex; }
    .camisa__input {
      background: transparent; border: 1px solid rgba(255,255,255,0.2); border-right: none;
      padding: 13px 18px; font-family: 'Inter', sans-serif; font-size: 0.78rem; font-weight: 300;
      color: #fff; outline: none; width: 220px;
    }
    .camisa__input::placeholder { color: rgba(255,255,255,0.2); }
    .camisa__input:focus { border-color: rgba(255,255,255,0.5); }
    .camisa__btn {
      background: var(--accent); color: #000; border: none; cursor: pointer;
      font-family: 'Inter', sans-serif; font-size: 0.65rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase; padding: 13px 20px;
    }
    .camisa__btn:hover { opacity: 0.85; }

    @media (max-width: 768px) {
      .camisa__copy { flex-direction: column; align-items: flex-start; padding: 48px 28px; }
      .camisa__right { align-items: flex-start; width: 100%; }
      .camisa__input { flex: 1; }
    }
  </style>
</head>
<body>

  <section class="camisa" id="camiseta">
    <div class="camisa__bg">
      <img src="assets/tshirt1.jpg" alt="La camiseta claudio">
    </div>
    <div class="camisa__copy">
      <div class="camisa__left">
        <span class="camisa__tag">Próximamente</span>
        <h2 class="camisa__title">La camiseta<br>Claudio</h2>
        <p class="camisa__sub">yo tan sólo soy un inquilino en este mundo de plástico,<br>un chatarrero limpiando el espacio</p>
      </div>
      <div class="camisa__right">
        <p class="camisa__avisa-label">Avísame cuando esté</p>
        <div class="camisa__form">
          <input class="camisa__input" type="email" placeholder="tu@email.com">
          <button class="camisa__btn">Avisar</button>
        </div>
      </div>
    </div>
  </section>

</body>
</html>
