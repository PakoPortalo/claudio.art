<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Testimonios — v5: Carousel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root { --accent: #EC6768; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; font-family: 'Inter', sans-serif; background: rgb(14,14,14); overflow-x: hidden; }

    .label-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 999;
      background: var(--accent); color: #000; text-align: center;
      padding: 7px 0; font-size: 0.65rem; font-weight: 700;
      letter-spacing: 0.2em; text-transform: uppercase;
    }

    /* ─── MÓDULO ─────────────────────────────────────────────────── */
    .testimonios {
      background: rgb(14,14,14);
      padding: 100px 40px 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .testimonios__header {
      text-align: center;
      margin-bottom: 52px;
    }

    .testimonios__tag {
      display: block;
      font-size: 0.65rem; font-weight: 500;
      letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--accent); margin-bottom: 16px;
    }

    .testimonios__title {
      font-family: 'Barlow Condensed', sans-serif; font-weight: 800;
      font-size: clamp(2.4rem, 5vw, 4rem);
      text-transform: uppercase; color: #fff; line-height: 1;
    }

    /* ─── CAROUSEL ───────────────────────────────────────────────── */
    .carousel {
      position: relative;
      width: 100%;
      max-width: 900px;
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .carousel__track-wrap {
      flex: 1;
      overflow: hidden;
      border-radius: 12px;
    }

    .carousel__track {
      display: flex;
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .carousel__slide {
      flex-shrink: 0;
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .carousel__img {
      aspect-ratio: 9/16;
      overflow: hidden;
      border-radius: 8px;
      background: #1a1a1a;
    }

    .carousel__img img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* ─── FLECHAS ────────────────────────────────────────────────── */
    .carousel__btn {
      flex-shrink: 0;
      width: 44px; height: 44px;
      border: 1px solid rgba(255,255,255,0.18);
      background: transparent;
      color: #fff;
      border-radius: 50%;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.2s, background 0.2s;
      font-size: 1rem;
    }

    .carousel__btn:hover { border-color: var(--accent); background: rgba(236,103,104,0.1); }
    .carousel__btn:disabled { opacity: 0.25; cursor: default; }

    /* ─── DOTS ───────────────────────────────────────────────────── */
    .carousel__dots {
      display: flex; gap: 8px;
      justify-content: center;
      margin-top: 32px;
    }

    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      cursor: pointer;
      transition: background 0.25s, transform 0.25s;
    }

    .dot.active { background: var(--accent); transform: scale(1.3); }

    /* ─── RESPONSIVE ─────────────────────────────────────────────── */
    @media (max-width: 768px) {
      .testimonios { padding: 72px 20px 64px; }
      .carousel { gap: 12px; }
      .carousel__btn { width: 36px; height: 36px; font-size: 0.85rem; }
      .carousel__slide { grid-template-columns: repeat(2, 1fr); gap: 6px; }
    }

    @media (max-width: 480px) {
      .carousel__btn { display: none; }
      .carousel__slide { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div class="label-bar">v5 — carousel 3 en pantalla con flechas</div>

  <section class="testimonios" style="margin-top: 32px;">
    <div class="testimonios__header">
      <span class="testimonios__tag">@cl4u8io · Instagram</span>
      <h2 class="testimonios__title">Lo que piensan</h2>
    </div>

    <div class="carousel">
      <button class="carousel__btn" id="prev" aria-label="Anterior">&#8592;</button>

      <div class="carousel__track-wrap">
        <div class="carousel__track" id="track">

          <!-- slide 1: imágenes 1-3 (desktop) / 1-2 (móvil) -->
          <div class="carousel__slide">
            <div class="carousel__img"><img src="assets/resenas-01.JPG" alt="" loading="lazy"></div>
            <div class="carousel__img"><img src="assets/resenas-02.jpg" alt="" loading="lazy"></div>
            <div class="carousel__img"><img src="assets/resenas-03.jpg" alt="" loading="lazy"></div>
          </div>

          <!-- slide 2: imágenes 4-6 -->
          <div class="carousel__slide">
            <div class="carousel__img"><img src="assets/resenas-04.jpg" alt="" loading="lazy"></div>
            <div class="carousel__img"><img src="assets/resenas-05.jpg" alt="" loading="lazy"></div>
            <div class="carousel__img"><img src="assets/resenas-06.jpg" alt="" loading="lazy"></div>
          </div>

          <!-- slide 3: imágenes 7-9 -->
          <div class="carousel__slide">
            <div class="carousel__img"><img src="assets/resenas-07.jpg" alt="" loading="lazy"></div>
            <div class="carousel__img"><img src="assets/resenas-08.jpg" alt="" loading="lazy"></div>
            <div class="carousel__img"><img src="assets/resenas-09.jpg" alt="" loading="lazy"></div>
          </div>

          <!-- slide 4: imagen 10 centrada -->
          <div class="carousel__slide">
            <div class="carousel__img"><img src="assets/resenas-10.jpg" alt="" loading="lazy"></div>
          </div>
        </div>
      </div>

      <button class="carousel__btn" id="next" aria-label="Siguiente">&#8594;</button>
    </div>

    <div class="carousel__dots" id="dots">
      <div class="dot active" data-i="0"></div>
      <div class="dot" data-i="1"></div>
      <div class="dot" data-i="2"></div>
      <div class="dot" data-i="3"></div>
    </div>
  </section>

  <script>
    const track = document.getElementById('track');
    const slides = track.querySelectorAll('.carousel__slide');
    const dots   = document.querySelectorAll('.dot');
    const prev   = document.getElementById('prev');
    const next   = document.getElementById('next');
    let current  = 0;

    function goTo(i) {
      current = Math.max(0, Math.min(i, slides.length - 1));
      track.style.transform = `translateX(-${current * 100}%)`;
      dots.forEach((d, idx) => d.classList.toggle('active', idx === current));
      prev.disabled = current === 0;
      next.disabled = current === slides.length - 1;
    }

    prev.addEventListener('click', () => goTo(current - 1));
    next.addEventListener('click', () => goTo(current + 1));
    dots.forEach(d => d.addEventListener('click', () => goTo(+d.dataset.i)));

    // swipe en móvil
    let startX = 0;
    track.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, { passive: true });
    track.addEventListener('touchend',   e => {
      const dx = e.changedTouches[0].clientX - startX;
      if (Math.abs(dx) > 40) goTo(dx < 0 ? current + 1 : current - 1);
    });

    goTo(0);
  </script>
</body>
</html>
