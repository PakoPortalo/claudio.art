<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claudio — Navbar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root { --accent: #EC6768; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; font-family: 'Inter', sans-serif; background: #000; overflow-x: hidden; }

    /* ─── NAVBAR ──────────────────────────────────────────────── */
    .navbar {
      position: fixed; top: 0; left: 0; z-index: 100;
      width: 100%; background: var(--accent); transition: background 3s ease;
      display: grid; grid-template-columns: 1fr auto 1fr;
      align-items: center; padding: 0 40px; height: 52px;
    }
    .navbar__logo { display: flex; align-items: center; text-decoration: none; }
    .navbar__links { display: flex; gap: 36px; list-style: none; justify-content: flex-end; }
    .navbar__links a {
      font-family: 'Inter', sans-serif; font-size: 0.8rem; font-weight: 500;
      color: #000; text-decoration: none; letter-spacing: 0.1em;
      text-transform: none; opacity: 0.85; transition: opacity 0.15s;
    }
    .navbar__links a:hover { opacity: 1; font-weight: 700; }
    .navbar__swatches { display: flex; gap: 8px; align-items: center; justify-content: flex-end; }
    .swatch {
      width: 16px; height: 16px; border-radius: 50%; cursor: pointer;
      border: 2px solid transparent; transition: transform 0.15s, border-color 0.15s;
    }
    .swatch:hover  { transform: scale(1.2); }
    .swatch.active { border-color: #000; }

    /* ─── MOBILE — oculto en desktop ─────────────────────────── */
    .navbar__burger { display: none; }
    .navbar__mobile-menu { display: none; }

    .navbar__logo { transition: opacity 0.25s ease; }

    @media (max-width: 768px) {
      .navbar { display: flex; padding: 0 28px; }
      .navbar__links { display: none; }
      .navbar__swatches { display: none; }

      .navbar__burger {
        display: flex; position: absolute; right: 20px; top: 50%; transform: translateY(-50%);
        flex-direction: column; justify-content: center; align-items: center; gap: 5px;
        width: 32px; height: 32px; background: none; border: none; cursor: pointer; padding: 0;
      }
      .navbar__burger span {
        display: block; width: 22px; height: 2px; background: #000;
        transition: transform 0.25s, opacity 0.25s;
      }
      .navbar__burger.is-open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
      .navbar__burger.is-open span:nth-child(2) { opacity: 0; }
      .navbar__burger.is-open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

      .navbar__mobile-menu {
        display: flex; position: fixed; top: 17px; left: 0; right: 0;
        background: var(--accent);
        flex-direction: column; align-items: stretch; justify-content: flex-start;
        padding-top: 36px; z-index: 99;
        visibility: hidden; opacity: 0; transform: translateY(-12px);
        transition: opacity 0.28s ease, transform 0.28s ease, visibility 0s linear 0.28s;
      }
      .navbar__mobile-menu.is-open {
        visibility: visible; opacity: 1; transform: translateY(0);
        transition: opacity 0.28s ease, transform 0.28s ease, visibility 0s;
      }
      .navbar__mobile-links { list-style: none; width: 100%; }
      .navbar__mobile-links li {
        border-top: 1px solid rgba(0,0,0,0.12);
        opacity: 0; transform: translateX(-12px);
        transition: opacity 0.22s ease, transform 0.22s ease;
      }
      .navbar__mobile-links li:last-child { border-bottom: 1px solid rgba(0,0,0,0.12); }
      .navbar__mobile-menu.is-open li:nth-child(1) { opacity: 1; transform: none; transition-delay: 0.10s; }
      .navbar__mobile-menu.is-open li:nth-child(2) { opacity: 1; transform: none; transition-delay: 0.17s; }
      .navbar__mobile-menu.is-open li:nth-child(3) { opacity: 1; transform: none; transition-delay: 0.24s; }
      .navbar__mobile-menu.is-open li:nth-child(4) { opacity: 1; transform: none; transition-delay: 0.31s; }
      .navbar__mobile-links a {
        display: block; width: 100%; padding: 20px 28px;
        font-family: 'Barlow Condensed', sans-serif; font-weight: 800;
        font-size: clamp(2rem, 10vw, 3.5rem); color: #000; text-decoration: none;
        text-transform: none; letter-spacing: 0.02em; line-height: 1; opacity: 0.85;
      }
      .navbar__mobile-links a:active { opacity: 1; background: rgba(0,0,0,0.05); }
    }

    /* ─── HERO ────────────────────────────────────────────────── */
    .hero { position: relative; width: 100%; height: 85vh; overflow: hidden; background: #000; margin-top: 52px; }
    .hero__video {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; display: block; z-index: 0;
      filter: grayscale(100%);
    }
    .hero__overlay {
      position: absolute; inset: 0; background: var(--accent);
      mix-blend-mode: multiply; transition: background 1s ease; z-index: 1;
    }
    .hero__canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 2; }
    .hero__scroll {
      position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%);
      z-index: 4; cursor: pointer; opacity: 0.55; transition: opacity 0.2s;
      animation: arrow-bounce 2s ease-in-out infinite;
    }
    .hero__scroll:hover { opacity: 1; }
    .hero__scroll svg { display: block; }
    @keyframes arrow-bounce {
      0%, 100% { transform: translateX(-50%) translateY(0);   opacity: 0.55; }
      50%       { transform: translateX(-50%) translateY(8px); opacity: 0.9; }
    }
    .hero__subtitle {
      position: absolute; top: 67%; left: 50%; transform: translateX(-50%);
      z-index: 3; color: #fff; font-family: 'Inter', sans-serif; font-size: 0.8rem;
      font-weight: 300; letter-spacing: 0.22em; text-transform: lowercase;
      white-space: nowrap; opacity: 0.65; pointer-events: none;
    }

    /* ─── TESTIMONIOS ────────────────────────────────────────── */
    .testimonios {
      background: #fff; padding: 100px 40px 110px;
      display: flex; flex-direction: column; align-items: center;
    }
    .testimonios__label {
      font-family: 'Barlow Condensed', sans-serif; font-size: clamp(2.4rem, 6vw, 4rem);
      font-weight: 800; text-transform: uppercase; letter-spacing: 0.02em;
      color: #111; text-align: center; margin-bottom: 60px; line-height: 1;
    }
    .testimonios__grid {
      width: 100%; max-width: 900px;
      columns: 3; column-gap: 16px;
    }
    @media (max-width: 600px) { .testimonios__grid { columns: 2; } }
    .testimonios__item {
      break-inside: avoid; margin-bottom: 16px; border-radius: 12px;
      overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      transition: transform 0.3s ease, opacity 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
    }
    .testimonios__grid:hover .testimonios__item {
      opacity: 0.35; transform: scale(0.97);
    }
    .testimonios__grid:hover .testimonios__item:hover {
      opacity: 1; transform: scale(1.03);
      box-shadow: 0 12px 36px rgba(0,0,0,0.16);
    }
    .testimonios__item img { width: 100%; height: auto; display: block; }

    /* ─── DROP MODULE ─────────────────────────────────────────── */
    .drop {
      position: relative;
      min-height: 100vh; background: #fff;
      display: flex; align-items: center; justify-content: center;
      padding: 80px 40px 100px;
    }
    .drop__inner {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 100px; align-items: center;
      max-width: 1100px; width: 100%;
    }


    /* Botones de estado dentro del módulo */
    .drop__state-btns {
      position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 8px; align-items: center;
    }
    .drop__state-btn {
      font-family: 'Inter', sans-serif; font-size: 0.65rem; font-weight: 500;
      letter-spacing: 0.1em; text-transform: uppercase; padding: 5px 11px;
      border: 1px solid rgba(0,0,0,0.18); background: transparent;
      color: rgba(0,0,0,0.35); cursor: pointer; transition: all 0.2s;
    }
    .drop__state-btn:hover,
    .drop__state-btn.active { border-color: #000; color: #000; background: rgba(0,0,0,0.05); }

    /* ─── PINTURA ─────────────────────────────────────────────── */
    .drop__painting-outer { display: flex; flex-direction: column; align-items: center; }
    .drop__painting-scene { perspective: 900px; perspective-origin: 50% 50%; }
    .drop__painting {
      width: 272px; height: 380px; position: relative;
      transform-style: preserve-3d; cursor: grab; user-select: none;
    }
    .drop__painting:active { cursor: grabbing; }
    .drop__painting.is-paused::after {
      content: '▶'; position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; color: rgba(0,0,0,0.25); z-index: 10; pointer-events: none;
    }
    .drop[data-state="agotado"] .drop__painting-outer { filter: saturate(0) brightness(0.7); }
    .painting__face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; }
    .painting__face--front { transform: translateZ(3px); overflow: hidden; background: #fff; }
    .painting-img {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: contain; display: block; opacity: 0; transition: opacity 0.4s ease;
    }
    .painting-img--active { opacity: 1; }
    .painting__face--back { transform: rotateY(180deg) translateZ(3px); overflow: hidden; }
    .painting__face--back img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .painting__face--left {
      position: absolute; width: 6px; height: 100%; top: 0; left: 0;
      transform-origin: left center; transform: rotateY(-90deg) translateX(-3px);
      background-image: url('../assets/producto-claudio/back.jpg');
      background-size: cover; background-position: center;
    }
    .painting__face--right {
      position: absolute; width: 6px; height: 100%; top: 0; right: 0;
      transform-origin: right center; transform: rotateY(90deg) translateX(3px);
      background-image: url('../assets/producto-claudio/back.jpg');
      background-size: cover; background-position: center;
    }
    .drop__shadow {
      width: 272px; height: 60px; background: rgba(0,0,0,0.2);
      border-radius: 50%; filter: blur(12px); margin-top: 24px; pointer-events: none;
    }

    /* ─── INFO ────────────────────────────────────────────────── */
    .drop__info { display: flex; flex-direction: column; }
    .drop__edition {
      font-family: 'Inter', sans-serif; font-size: 0.7rem; font-weight: 500;
      letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--accent); margin-bottom: 28px; transition: color 3s ease;
    }
    .drop__divider { width: 40px; height: 1px; background: rgba(0,0,0,0.12); margin-bottom: 28px; }
    .drop__state { display: none; }
    .drop__state.is-active { display: block; }

    /* ─── CUENTA ATRÁS ────────────────────────────────────────── */
    .cd__tag {
      font-size: 0.7rem; font-weight: 500; letter-spacing: 0.22em;
      text-transform: uppercase; color: var(--accent);
      margin-bottom: 28px; transition: color 3s ease; display: block;
    }
    .cd__timer {
      display: flex; align-items: flex-start; gap: 0; margin-bottom: 24px;
    }
    .cd__unit { display: flex; flex-direction: column; align-items: center; min-width: 80px; }
    .cd__num {
      font-family: 'Barlow Condensed', sans-serif; font-weight: 800;
      font-size: clamp(3rem, 6vw, 5.5rem);
      line-height: 0.9; letter-spacing: -0.02em; color: #000;
    }
    .cd__unit-label {
      font-size: 0.55rem; font-weight: 400; letter-spacing: 0.22em;
      text-transform: uppercase; color: rgba(0,0,0,0.25); margin-top: 8px;
    }
    .cd__sep {
      font-family: 'Barlow Condensed', sans-serif; font-weight: 800;
      font-size: clamp(3rem, 6vw, 5.5rem);
      line-height: 0.9; color: rgba(0,0,0,0.12); padding: 0 2px; align-self: flex-start;
    }
    .cd__date {
      font-size: 0.78rem; font-weight: 300; color: rgba(0,0,0,0.4); line-height: 1.6;
    }
    .cd__date strong { font-weight: 500; color: #000; }

    /* ─── DISPONIBLE ──────────────────────────────────────────── */
    .drop__title {
      font-family: 'Barlow Condensed', sans-serif; font-weight: 800;
      font-size: clamp(2.2rem, 4vw, 3.5rem); line-height: 1.05;
      text-transform: uppercase; color: #000; margin-bottom: 20px;
    }
    .drop__title .accent { color: var(--accent); transition: color 3s ease; }
    .drop__body {
      font-family: 'Inter', sans-serif; font-size: 0.88rem; font-weight: 300;
      line-height: 1.7; color: rgba(0,0,0,0.5); margin-bottom: 36px; max-width: 340px;
    }
    .drop__price {
      font-family: 'Barlow Condensed', sans-serif; font-weight: 800;
      font-size: 2.2rem; color: #000; margin-bottom: 32px;
    }
    .drop__btn {
      display: inline-block; background: var(--accent); color: #000;
      font-family: 'Inter', sans-serif; font-size: 0.75rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase; padding: 16px 44px;
      border: none; cursor: pointer; transition: background 3s ease, opacity 0.2s;
      align-self: flex-start;
    }
    .drop__btn:hover { opacity: 0.8; }

    /* ─── AGOTADO ─────────────────────────────────────────────── */
    .drop__agotado-title {
      font-family: 'Barlow Condensed', sans-serif; font-weight: 800;
      font-size: clamp(2.2rem, 4vw, 3.5rem); line-height: 1.05;
      text-transform: uppercase; color: var(--accent); transition: color 3s ease;
      margin-bottom: 16px;
    }
    .drop__agotado-wow {
      font-family: 'Inter', sans-serif; font-size: 0.95rem; font-weight: 400;
      line-height: 1.6; color: rgba(0,0,0,0.5); margin-bottom: 28px; max-width: 340px;
    }
    .drop__agotado-cta {
      font-family: 'Inter', sans-serif; font-size: 0.88rem; font-weight: 300;
      line-height: 1.7; color: var(--accent); transition: color 3s ease;
      margin-bottom: 24px; max-width: 340px;
    }
    .drop__waitlist { display: flex; max-width: 380px; }
    .drop__waitlist input {
      flex: 1; background: transparent;
      border: 1px solid rgba(0,0,0,0.15); border-right: none; padding: 12px 16px;
      font-family: 'Inter', sans-serif; font-size: 0.8rem; font-weight: 300;
      color: #000; outline: none;
    }
    .drop__waitlist input::placeholder { color: rgba(0,0,0,0.25); }
    .drop__waitlist input:focus { border-color: rgba(0,0,0,0.4); }
    .drop__waitlist button {
      background: var(--accent); border: 1px solid var(--accent); padding: 12px 20px;
      font-family: 'Inter', sans-serif; font-size: 0.65rem; font-weight: 500;
      letter-spacing: 0.15em; text-transform: uppercase; color: #000; cursor: pointer;
      transition: background 3s ease, border-color 3s ease, opacity 0.2s;
    }
    .drop__waitlist button:hover { opacity: 0.8; }

    /* ─── CAMISETA ───────────────────────────────────────────── */
    .camisa {
      position: relative; width: 100%; min-height: 90vh;
      display: flex; align-items: flex-end; overflow: hidden;
    }
    .camisa__bg {
      position: absolute; inset: 0; background: rgb(16,16,16);
      display: flex; align-items: center; justify-content: center;
    }
    .camisa__bg img { width: auto; height: 72%; object-fit: contain; display: block; }
    .camisa__bg-placeholder {
      font-family: 'Inter', sans-serif; font-size: 0.75rem; font-weight: 300;
      letter-spacing: 0.15em; text-transform: uppercase; color: rgba(255,255,255,0.2);
    }
    .camisa::after {
      content: ''; position: absolute; inset: 0; z-index: 1;
      background: linear-gradient(to top, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.1) 50%, transparent 100%);
    }
    .camisa__copy {
      position: relative; z-index: 2;
      padding: 60px 72px; width: 100%;
      display: flex; align-items: flex-end; justify-content: space-between;
    }
    .camisa__left { display: flex; flex-direction: column; gap: 12px; }
    .camisa__tag {
      font-family: 'Inter', sans-serif; font-size: 0.65rem; font-weight: 500;
      letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent);
      transition: color 3s ease;
    }
    .camisa__title {
      font-family: 'Barlow Condensed', sans-serif; font-weight: 800;
      font-size: clamp(3rem, 7vw, 6rem); line-height: 1; text-transform: uppercase; color: #fff;
    }
    .camisa__sub {
      font-family: 'Inter', sans-serif; font-size: 0.8rem; font-weight: 300;
      letter-spacing: 0.15em; color: rgba(255,255,255,0.55); text-transform: lowercase;
    }
    .camisa__right { display: flex; flex-direction: column; align-items: flex-end; gap: 20px; }
    .camisa__price {
      font-family: 'Barlow Condensed', sans-serif; font-weight: 800;
      font-size: 3rem; color: #fff; line-height: 1;
    }
    .camisa__btn {
      background: var(--accent); color: #000; border: none; cursor: pointer;
      font-family: 'Inter', sans-serif; font-size: 0.75rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase; padding: 16px 44px;
      transition: background 3s ease, opacity 0.2s;
    }
    .camisa__btn:hover { opacity: 0.8; }

    /* ─── SOBRE ───────────────────────────────────────────────── */
    .sobre {
      background: rgb(14,14,14);
      min-height: 100vh; padding: 100px 80px;
      display: flex; align-items: center; justify-content: center;
      gap: 80px; overflow: hidden;
    }
    .sobre__cluster { position: relative; width: 580px; height: 540px; flex-shrink: 0; }
    .shot {
      position: absolute; border-radius: 10px; overflow: hidden;
      background: #1c1c1c;
      box-shadow: 0 8px 32px rgba(0,0,0,0.65), 0 2px 8px rgba(0,0,0,0.4);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .shot::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; z-index: 2;
      background: linear-gradient(90deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
    }
    .shot img, .shot video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .shot-label {
      position: absolute; bottom: 10px; left: 0; right: 0; text-align: center; z-index: 1;
      font-family: 'Inter', sans-serif; font-size: 0.55rem; font-weight: 300;
      letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.12);
    }
    .shot--dark { background: #161616; }
    /* Posiciones A.0 */
    .ca .s1 { width:200px; height:250px; left:140px; top:100px; transform:rotate(-4deg);  z-index:4; }
    .ca .s2 { width:185px; height:231px; left:308px; top:158px; transform:rotate(6deg);   z-index:5; }
    .ca .s3 { width:120px; height:260px; left:8px;   top:122px; transform:rotate(-8deg);  z-index:2; }
    .ca .s4 { width:195px; height:244px; left:55px;  top:252px; transform:rotate(3deg);   z-index:3; }
    .ca .s5 { width:118px; height:255px; left:432px; top:95px;  transform:rotate(7deg);   z-index:2; }
    .ca .s6 { width:180px; height:225px; left:318px; top:292px; transform:rotate(-5deg);  z-index:6; }
    .ca .s7 { width:165px; height:220px; left:190px; top:300px; transform:rotate(2deg);   z-index:3; }
    .ca .s8 { width:112px; height:242px; left:455px; top:250px; transform:rotate(-9deg);  z-index:1; }
    .ca .sreel {
      width: 190px; height: 336px;
      left: 195px; top: 102px;
      transform: rotate(-3deg);
      z-index: 10;
      box-shadow: 0 20px 64px rgba(0,0,0,0.85), 0 4px 16px rgba(0,0,0,0.6);
    }
    .ca .s1:hover { transform:rotate(-4deg) scale(1.05); z-index:20; box-shadow:0 16px 48px rgba(0,0,0,0.85); }
    .ca .s2:hover { transform:rotate(6deg)  scale(1.05); z-index:20; box-shadow:0 16px 48px rgba(0,0,0,0.85); }
    .ca .s3:hover { transform:rotate(-8deg) scale(1.05); z-index:20; box-shadow:0 16px 48px rgba(0,0,0,0.85); }
    .ca .s4:hover { transform:rotate(3deg)  scale(1.05); z-index:20; box-shadow:0 16px 48px rgba(0,0,0,0.85); }
    .ca .s5:hover { transform:rotate(7deg)  scale(1.05); z-index:20; box-shadow:0 16px 48px rgba(0,0,0,0.85); }
    .ca .s6:hover { transform:rotate(-5deg) scale(1.05); z-index:20; box-shadow:0 16px 48px rgba(0,0,0,0.85); }
    .ca .s7:hover { transform:rotate(2deg)  scale(1.05); z-index:20; box-shadow:0 16px 48px rgba(0,0,0,0.85); }
    .ca .s8:hover { transform:rotate(-9deg) scale(1.05); z-index:20; box-shadow:0 16px 48px rgba(0,0,0,0.85); }
    .ca .sreel:hover { transform:rotate(-3deg) scale(1.04); z-index:20; box-shadow:0 24px 72px rgba(0,0,0,0.9); }
    /* Reel UI */
    @keyframes spin-vinyl { to { transform: rotate(360deg); } }
    .shot--reel { background: #000; }
    .shot--reel::before { display: none; }
    .shot--reel video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
    .reel-overlay { position: absolute; inset: 0; pointer-events: none; }
    .reel-top-grad { position: absolute; top: 0; left: 0; right: 0; height: 30%; background: linear-gradient(to bottom, rgba(0,0,0,0.5) 0%, transparent 100%); }
    .reel-bot-grad { position: absolute; bottom: 0; left: 0; right: 0; height: 58%; background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.35) 50%, transparent 100%); }
    .reel-progress { position: absolute; top: 5px; left: 6px; right: 6px; height: 2px; background: rgba(255,255,255,0.22); border-radius: 1px; z-index: 2; }
    .reel-progress-fill { height: 100%; width: 32%; background: #fff; border-radius: 1px; }
    .reel-actions { position: absolute; right: 5px; bottom: 54px; display: flex; flex-direction: column; align-items: center; gap: 9px; }
    .reel-action { display: flex; flex-direction: column; align-items: center; gap: 1px; }
    .reel-action svg { width: 15px; height: 15px; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.6)); }
    .reel-action-count { font-family: -apple-system, sans-serif; font-size: 5.5px; font-weight: 700; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.6); line-height: 1; }
    .reel-vinyl-wrap { width: 19px; height: 19px; border-radius: 50%; background: radial-gradient(circle, #444 0%, #111 100%); border: 1.5px solid rgba(255,255,255,0.25); display: flex; align-items: center; justify-content: center; animation: spin-vinyl 4s linear infinite; }
    .reel-vinyl-dot { width: 5px; height: 5px; border-radius: 50%; background: #000; border: 1px solid rgba(255,255,255,0.2); }
    .reel-bottom { position: absolute; bottom: 6px; left: 6px; right: 26px; }
    .reel-user { display: flex; align-items: center; gap: 4px; margin-bottom: 3px; }
    .reel-avatar { width: 15px; height: 15px; border-radius: 50%; flex-shrink: 0; background: var(--accent); border: 1.5px solid #fff; }
    .reel-username { font-family: -apple-system, sans-serif; font-size: 7.5px; font-weight: 700; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.6); white-space: nowrap; }
    .reel-follow { margin-left: 2px; border: 1px solid rgba(255,255,255,0.85); background: transparent; font-family: -apple-system, sans-serif; font-size: 5.5px; font-weight: 700; color: #fff; padding: 1.5px 4px; border-radius: 3px; cursor: pointer; white-space: nowrap; }
    .reel-caption { font-family: -apple-system, sans-serif; font-size: 6.5px; font-weight: 400; color: rgba(255,255,255,0.92); line-height: 1.35; margin-bottom: 4px; text-shadow: 0 1px 2px rgba(0,0,0,0.6); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; }
    .reel-audio-row { display: flex; align-items: center; gap: 3px; overflow: hidden; }
    .reel-audio-note { font-size: 7px; color: #fff; flex-shrink: 0; }
    .reel-audio-text { font-family: -apple-system, sans-serif; font-size: 6px; font-weight: 400; color: rgba(255,255,255,0.8); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    /* Info */
    .sobre__info { display: flex; flex-direction: column; max-width: 360px; }
    .sobre__tag {
      font-family: 'Inter', sans-serif; font-size: 0.65rem; font-weight: 500;
      letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent);
      margin-bottom: 24px; transition: color 3s ease;
    }
    .sobre__divider { width: 40px; height: 1px; background: rgba(255,255,255,0.12); margin-bottom: 28px; }
    .sobre__title {
      font-family: 'Barlow Condensed', sans-serif; font-weight: 800;
      font-size: clamp(2.8rem, 4.5vw, 4.2rem); line-height: 1;
      text-transform: uppercase; color: #fff; margin-bottom: 24px;
    }
    .sobre__body {
      font-family: 'Inter', sans-serif; font-size: 0.92rem; font-weight: 300;
      line-height: 1.9; color: rgba(255,255,255,0.45); margin-bottom: 40px;
    }
    .sobre__cta-label {
      font-family: 'Inter', sans-serif; font-size: 1.1rem; font-weight: 400;
      color: rgba(255,255,255,0.35); margin-bottom: 16px; text-align: justify;
    }
    .sobre__btns { display: flex; gap: 12px; flex-wrap: wrap; }
    .sobre__btn {
      display: inline-flex; align-items: center; gap: 10px;
      text-decoration: none;
      background: transparent; border: 1px solid rgba(255,255,255,0.18); color: var(--accent);
      font-family: 'Inter', sans-serif; font-size: 0.75rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase; padding: 14px 24px;
      transition: border-color 0.2s, background 0.2s;
    }
    .sobre__btn:hover { border-color: var(--accent); background: rgba(236,103,104,0.08); }
    .sobre__btn svg { flex-shrink: 0; }

    /* ─── NEWSLETTER ─────────────────────────────────────────── */
    .newsletter {
      background: var(--accent);
      padding: 100px 72px;
      display: flex; flex-direction: column; align-items: center;
      gap: 40px; text-align: center;
      transition: background 3s ease;
    }
    .newsletter__tag {
      font-size: 0.65rem; font-weight: 500; letter-spacing: 0.25em;
      text-transform: uppercase; color: rgba(0,0,0,0.5);
    }
    .newsletter__title {
      font-family: 'Barlow Condensed', sans-serif; font-weight: 800;
      font-size: clamp(3rem, 6vw, 5.5rem); text-transform: uppercase;
      color: #000; line-height: 0.95; max-width: 700px;
    }
    .newsletter__sub {
      font-size: 0.85rem; font-weight: 300; color: rgba(0,0,0,0.6);
      max-width: 460px; line-height: 1.7;
    }
    .newsletter__form {
      display: flex; gap: 0; width: 100%; max-width: 440px;
    }
    .newsletter__input {
      flex: 1; background: rgba(0,0,0,0.12); border: 1px solid rgba(0,0,0,0.25);
      border-right: none; color: #000; font-family: 'Inter', sans-serif;
      font-size: 0.8rem; padding: 16px 20px; outline: none;
      transition: border-color 0.2s;
    }
    .newsletter__input::placeholder { color: rgba(0,0,0,0.3); }
    .newsletter__input:focus { border-color: rgba(0,0,0,0.6); }
    .newsletter__btn {
      background: #000; color: #fff; border: none; cursor: pointer;
      font-family: 'Inter', sans-serif; font-size: 0.7rem; font-weight: 500;
      letter-spacing: 0.2em; text-transform: uppercase; padding: 16px 28px;
      transition: opacity 0.2s; white-space: nowrap;
    }
    .newsletter__btn:hover { opacity: 0.7; }
    .newsletter__legal {
      font-size: 0.65rem; color: rgba(0,0,0,0.35); letter-spacing: 0.05em;
    }

    /* ─── FOOTER ─────────────────────────────────────────────── */
    .footer {
      background: #000; padding: 72px 72px 40px;
    }
    .footer__top {
      display: flex; justify-content: space-between; align-items: flex-start;
      padding-bottom: 48px; border-bottom: 1px solid rgba(255,255,255,0.07);
      gap: 48px;
    }
    .footer__brand { display: flex; flex-direction: column; gap: 16px; max-width: 300px; }
    .footer__logo {
      font-family: 'Barlow Condensed', sans-serif; font-weight: 800;
      font-size: 1.8rem; text-transform: none; color: #fff; letter-spacing: 0.02em;
    }
    .footer__logo span { color: var(--accent); transition: color 3s ease; }
    .footer__tagline {
      font-size: 0.78rem; font-weight: 300; color: rgba(255,255,255,0.35); line-height: 1.65;
    }
    .footer__cols { display: flex; gap: 64px; }
    .footer__col { display: flex; flex-direction: column; gap: 16px; }
    .footer__col-title {
      font-size: 0.6rem; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase;
      color: rgba(255,255,255,0.25);
    }
    .footer__col a {
      font-size: 0.78rem; font-weight: 300; color: rgba(255,255,255,0.5);
      text-decoration: none; transition: color 0.2s; display: block;
    }
    .footer__col a:hover { color: #fff; }
    .footer__middle {
      padding: 32px 0; border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .footer__privacy-title {
      font-size: 0.6rem; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase;
      color: rgba(255,255,255,0.25); margin-bottom: 12px;
    }
    .footer__privacy-text {
      font-size: 0.7rem; font-weight: 300; color: rgba(255,255,255,0.25);
      line-height: 1.7; max-width: 720px;
    }
    .footer__privacy-text a {
      color: rgba(255,255,255,0.4); text-decoration: underline; transition: color 0.2s;
    }
    .footer__privacy-text a:hover { color: #fff; }
    .footer__bottom {
      display: flex; justify-content: space-between; align-items: center;
      padding-top: 28px; gap: 24px; flex-wrap: wrap;
    }
    .footer__legal { font-size: 0.65rem; color: rgba(255,255,255,0.15); letter-spacing: 0.05em; }
    .footer__socials { display: flex; gap: 20px; }
    .footer__socials a {
      font-size: 0.7rem; color: rgba(255,255,255,0.25); text-decoration: none; transition: color 0.2s;
    }
    .footer__socials a:hover { color: var(--accent); }
  </style>
</head>

    </ul>
  </div>

  <script>
    document.querySelectorAll('.swatch').forEach(swatch => {
      swatch.addEventListener('click', () => {
        document.documentElement.style.setProperty('--accent', swatch.dataset.color);
        document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
        swatch.classList.add('active');
      });
    });

    const burger = document.getElementById('navbar-burger');
    const menu   = document.getElementById('navbar-mobile-menu');
    burger.addEventListener('click', () => {
      const open = burger.classList.toggle('is-open');
      menu.classList.toggle('is-open', open);
      document.body.style.overflow = open ? 'hidden' : '';
    });
    function closeMobileMenu() {
      burger.classList.remove('is-open');
      menu.classList.remove('is-open');
      document.body.style.overflow = '';
    }
  </script>
